<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6750A4">
<title>نتیجه ارزیابی | Street Shot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  :root {
    --md-primary: #6750A4;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #EADDFF;
    --md-on-primary-container: #21005D;
    --md-secondary-container: #E8DEF8;
    --md-on-secondary-container: #1D192B;
    --md-background: #FEF7FF;
    --md-on-background: #1D1B20;
    --md-surface: #FEF7FF;
    --md-on-surface: #1D1B20;
    --md-surface-variant: #E7E0EC;
    --md-on-surface-variant: #49454F;
    --md-surface-container: #F3EDF7;
    --md-outline: #79747E;
    --md-outline-variant: #CAC4D0;
    --md-radius-md: 12px;
    --md-radius-xl: 28px;
    --md-radius-full: 999px;
    --md-elev-1: 0 1px 3px rgba(0,0,0,.08);
    --md-elev-2: 0 3px 6px rgba(0,0,0,.08);
    --md-font: 'Roboto', 'Vazirmatn', system-ui, sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--md-font);
    background: var(--md-background);
    color: var(--md-on-background);
    line-height: 1.9;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  .container { width: min(720px, 92%); margin: 0 auto; }

  .top-app-bar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(254,247,255,.92);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--md-outline-variant);
    padding: calc(10px + var(--safe-top)) 0 10px;
  }
  .top-app-bar .container { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1rem; color: var(--md-primary); }
  .brand .material-symbols-outlined { font-size: 22px; }
  .brand span:last-child { color: var(--md-on-surface); }

  .result-wrap { padding: clamp(32px, 6vw, 64px) 0 calc(48px + var(--safe-bottom)); text-align: center; }

  .score-circle {
    width: 180px; height: 180px;
    border-radius: 50%;
    margin: 0 auto 24px;
    display: grid; place-items: center;
    background: conic-gradient(var(--md-primary) calc(var(--p) * 1%), var(--md-surface-variant) 0);
    position: relative;
  }
  .score-circle::before {
    content: '';
    position: absolute; inset: 14px;
    border-radius: 50%;
    background: var(--md-background);
  }
  .score-circle .inner {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
  }
  .score-circle .score-num {
    font-size: 2.6rem; font-weight: 800; color: var(--md-primary); line-height: 1;
  }
  .score-circle .score-max {
    font-size: .9rem; color: var(--md-on-surface-variant); margin-top: 4px;
  }

  .result-title {
    font-size: clamp(1.4rem, 4.5vw, 2rem);
    font-weight: 800;
    margin-bottom: 12px;
  }
  .result-desc {
    color: var(--md-on-surface-variant);
    font-size: 1rem;
    max-width: 520px;
    margin: 0 auto 28px;
    line-height: 1.9;
  }

  .result-card {
    background: var(--md-surface-container);
    border-radius: var(--md-radius-xl);
    padding: clamp(20px, 5vw, 32px);
    border: 1px solid var(--md-outline-variant);
    box-shadow: var(--md-elev-1);
    text-align: right;
    margin-bottom: 28px;
  }
  .result-card h3 {
    font-size: 1.1rem; font-weight: 800; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .result-card h3 .material-symbols-outlined { color: var(--md-primary); }
  .result-card p { color: var(--md-on-surface-variant); font-size: .95rem; margin-bottom: 8px; }
  .result-card ul { padding-right: 22px; color: var(--md-on-surface-variant); font-size: .95rem; }
  .result-card li { margin-bottom: 6px; }

  .actions { display: flex; flex-direction: column; gap: 12px; }
  .md-btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 14px 28px;
    border-radius: var(--md-radius-full);
    font-size: 1rem; font-weight: 700;
    border: none; transition: all .15s ease;
    min-height: 52px; touch-action: manipulation;
  }
  .md-btn-filled { background: var(--md-primary); color: var(--md-on-primary); box-shadow: var(--md-elev-1); }
  .md-btn-filled:hover { box-shadow: var(--md-elev-2); filter: brightness(1.05); }
  .md-btn-tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .md-btn-tonal:hover { filter: brightness(.97); }
  .md-btn .material-symbols-outlined { font-size: 20px; }
</style>
</head>
<body>

<header class="top-app-bar">
  <div class="container">
    <a href="index.html" class="brand" aria-label="Street Shot">
      <span class="material-symbols-outlined">photo_camera</span>
      <span>Street Shot</span>
    </a>
  </div>
</header>

<main class="container result-wrap">
  <div class="score-circle" id="scoreCircle" style="--p:0">
    <div class="inner">
      <span class="score-num" id="scoreNum">۰</span>
      <span class="score-max" id="scoreMax">از ۲۷</span>
    </div>
  </div>

  <h1 class="result-title" id="resultTitle">در حال محاسبه...</h1>
  <p class="result-desc" id="resultDesc"></p>

  <div class="result-card" id="nextSteps" style="display:none">
    <h3><span class="material-symbols-outlined">arrow_forward</span> مرحله بعدی</h3>
    <div id="nextStepsContent"></div>
  </div>

  <div class="actions">
    <a href="index.html" class="md-btn md-btn-tonal">
      <span class="material-symbols-outlined">home</span>
      بازگشت به صفحه اصلی
    </a>
  </div>
</main>

<script>
  const score = parseInt(localStorage.getItem('streetshot_score') || '0', 10);
  const max = parseInt(localStorage.getItem('streetshot_max') || '27', 10);
  const percent = Math.round((score / max) * 100);

  const faNum = n => n.toLocaleString('fa-IR');
  const circle = document.getElementById('scoreCircle');
  const scoreNum = document.getElementById('scoreNum');
  const scoreMax = document.getElementById('scoreMax');
  const title = document.getElementById('resultTitle');
  const desc = document.getElementById('resultDesc');
  const nextSteps = document.getElementById('nextSteps');
  const nextContent = document.getElementById('nextStepsContent');

  // انیمیشن دایره
  setTimeout(() => {
    circle.style.transition = 'background .9s ease';
    circle.style.setProperty('--p', percent);
  }, 100);

  scoreNum.textContent = faNum(score);
  scoreMax.textContent = 'از ' + faNum(max);

  let level, message, steps;

  if (percent >= 80) {
    level = 'عالی';
    message = 'شما شرایط بسیار خوبی برای همکاری با Street Shot دارید. تیم ما به‌زودی با شما تماس می‌گیرد.';
    steps = [
      'درخواست شما در اولویت بررسی قرار گرفت.',
      'طی ۲۴ تا ۴۸ ساعت آینده با شما تماس می‌گیریم.',
      'برای آمادگی، نمونه‌کارهای خود را در اینستاگرام یا وب‌سایت مرتب کنید.'
    ];
  } else if (percent >= 55) {
    level = 'خوب';
    message = 'پاسخ‌های شما نشان می‌دهد پتانسیل همکاری وجود دارد. تیم ما پاسخ‌های تشریحی شما را هم بررسی می‌کند.';
    steps = [
      'پاسخ‌های شما در حال بررسی توسط تیم است.',
      'ممکن است برای مصاحبه کوتاه دعوت شوید.',
      'طی ۴۸ تا ۷۲ ساعت آینده با شما تماس می‌گیریم.'
    ];
  } else {
    level = 'نیاز به بررسی بیشتر';
    message = 'بر اساس پاسخ‌های شما، ممکن است این موقعیت نیازمند ویژگی‌هایی باشد که در پاسخ‌هایتان کمتر دیده شد. اما تیم ما پاسخ‌های تشریحی را هم بررسی می‌کند.';
    steps = [
      'پاسخ‌های تشریحی شما به‌طور کامل بررسی می‌شود.',
      'ممکن است پیشنهادهای دیگری برای همکاری داشته باشیم.',
      'در هر صورت، نتیجه را طی ۷۲ ساعت آینده به شما اطلاع می‌دهیم.'
    ];
  }

  title.textContent = 'نتیجه: ' + level;
  desc.textContent = message;
  nextContent.innerHTML = '<ul>' + steps.map(s => '<li>' + s + '</li>').join('') + '</ul>';
  nextSteps.style.display = 'block';
</script>

</body>
</html>
